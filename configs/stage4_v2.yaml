# configs/stage4_v2.yaml

# ------------------------------------------------------------------------
# STAGE 4: AERIAL SPECIALIZATION (Pure VisDrone)
# Goal: Fix Localization (IoU) and Track Stability (ID Switches)
# ------------------------------------------------------------------------

# Inherit architecture settings
SUPER_CONFIG_PATH: ./configs/r50_deformable_detr_motip_dancetrack.yaml
root_path: "."

# ⚠️ LOAD STAGE 3 WEIGHTS
# (Ensure this path points to your best/final Stage 3 checkpoint)
DETR_PRETRAIN: "./pretrains/motip_stage3_v2.pth"

# Reset Optimizer to adapt to the new "Pure Aerial" distribution
RESUME_OPTIMIZER: False
RESUME_SCHEDULER: False

# ------------------------------------------------------------------------
# Hyperparameters for Small Objects
# ------------------------------------------------------------------------
NUM_CLASSES: 2
EPOCHS: 10

# Low LR to refine box regression without exploding
LR: 2.0e-6
LR_BACKBONE: 1.0e-6
LR_DROP: 7

# 🚀 HIGHER RESOLUTION
# This is critical for fixing the "Red on Blue" overlap issue.
# The model needs more pixels to get the box edges perfect.
AUG_MAX_SIZE: 1333
AUG_RESIZE_SCALES: [800, 900, 1000, 1100, 1200]
AUG_RANDOM_RESIZE: [800, 1000, 1200]

# Batch size might need to be 1 on A10G with this resolution
BATCH_SIZE: 1
ACCUMULATE_STEPS: 4

MEMORY_EFFICIENT: True
USE_DECODER_CHECKPOINT: True

# ------------------------------------------------------------------------
# Dataset & Validation
# ------------------------------------------------------------------------
# Point to the Stage 4 symlink we just created
DATASET_ROOT: "./datasets/Stage4"
TRAIN_DATASET_FILE: "./datasets/Stage4/annotations/train.json"
VAL_DATASET_FILE: "./datasets/Stage4/annotations/val.json"

val_config:
  GT_FOLDER: "./datasets/DanceTrack/val"
  SEQMAP_FILE: "./datasets/DanceTrack/val_seqmap.txt"
  SPLIT_TO_EVAL: "val"
  
  CLASSES_TO_EVAL: ['pedestrian', 'car'] 
  CLASS_NAME_TO_ID: 
    pedestrian: 1
    car: 2