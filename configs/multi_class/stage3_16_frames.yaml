# configs/multi_class/stage3_16_frames.yaml

# ------------------------------------------------------------------------
# STAGE 3: TEMPORAL EXPANSION (16-Frame Window)
# Goal: Bridge long occlusions and reach 40%+ IDF1
# Logic: Maximum temporal depth for A10G (24GB) limits.
# ------------------------------------------------------------------------

SUPER_CONFIG_PATH: ./configs/r50_deformable_detr_motip_dancetrack.yaml
root_path: "."
SEED: 12
NUM_CLASSES: 2
NUM_ID_VOCABULARY: 1000

# Weights Initialization
# Resuming from the end of the Stage 2 "Plateau"
DETR_PRETRAIN: ./pretrains/motip_stage2_refine.pth
RESUME_OPTIMIZER: False
RESUME_SCHEDULER: False

# ------------------------------------------------------------------------
# Training Strategy: 6-Epoch 
# ------------------------------------------------------------------------
EPOCHS: 6           
LR: 5.0e-6          # Ultra-low to preserve the high-precision foundation
LR_DROP: 4          
LR_BACKBONE: 5.0e-7
LR_WARMUP_EPOCHS: 1 

# --- CRITICAL CHANGE ---
# Deep Temporal Window: 16 frames forces the model to learn Re-ID signatures
sampler_lengths: [16]
sample_intervals: [2, 3, 4, 5] # Increased intervals to simulate longer occlusions

# ------------------------------------------------------------------------
# Hardware Safety (A10G Hard Limit)
# ------------------------------------------------------------------------
BATCH_SIZE: 1
ACCUMULATE_STEPS: 4       
NUM_WORKERS: 2        
USE_DECODER_CHECKPOINT: True
PREFETCH_FACTOR: 2     
MEMORY_EFFICIENT: True

# Keep 608px to prevent OOM during the 16-frame attention calculation
AUG_MAX_SIZE: 608
AUG_RANDOM_RESIZE: [256, 320, 384, 448, 480, 512, 544, 576, 608]

# ------------------------------------------------------------------------
# Validation Config (Targeting IDF1)
# ------------------------------------------------------------------------
val_config:
  GT_FOLDER: "./datasets/DanceTrack/val"
  SEQMAP_FILE: "./datasets/DanceTrack/val_seqmap.txt"
  SPLIT_TO_EVAL: "val"
  CLASSES_TO_EVAL: ['pedestrian', 'car'] 
  LIMIT_VAL_FRAMES: 100 # Keep 100 frames for speed
  LIMIT_VAL_SEQ: 5      
  CLASS_NAME_TO_ID: 
    pedestrian: 1
    car: 2

# Inference Settings: "Production" Mode
INFERENCE_MAX_LONGER: 1333
ASSIGNMENT_PROTOCOL: hungarian
DET_THRESH: 0.4             # Slightly higher for cleaner results
NEWBORN_THRESH: 0.4         
ID_THRESH: 0.3              # Stricter ID matching