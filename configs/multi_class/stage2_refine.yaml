# configs/multi_class/stage2_refine.yaml

# ------------------------------------------------------------------------
# STAGE 2: TEMPORAL REFINEMENT & IDENTITY GLUE
# Goal: Bridge the 7% Recall gap and consolidate 19,000+ IDs.
# ------------------------------------------------------------------------

SUPER_CONFIG_PATH: ./configs/r50_deformable_detr_motip_dancetrack.yaml
root_path: "."
SEED: 12
NUM_CLASSES: 2
NUM_ID_VOCABULARY: 1000

# Weights Initialization
# Start from the best stable foundation
DETR_PRETRAIN: ./pretrains/motip_stage1_stabilize.pth
RESUME_OPTIMIZER: False
RESUME_SCHEDULER: False

# ------------------------------------------------------------------------
# Training Strategy: 8-Epoch Refinement
# ------------------------------------------------------------------------
EPOCHS: 8           
LR: 1.0e-5          
LR_DROP: 6          
LR_BACKBONE: 1.0e-6
LR_WARMUP_EPOCHS: 1 
LR_DICTIONARY_SCALE: 1.0 

# ------------------------------------------------------------------------
# LOSS REBALANCING & IDENTITY GLUE
# ------------------------------------------------------------------------
DETR_CLS_LOSS_COEF: 5.0    # Force the queries to find small pedestrians
DETR_BBOX_LOSS_COEF: 5.0
DETR_GIOU_LOSS_COEF: 2.0

ID_LOSS_WEIGHT: 1.0        
ID_TEMPERATURE: 0.07       # Crucial for InfoNCE contrastive sharpening
USE_FOCAL_LOSS: False      # Stick to CE for better contrastive performance

# ------------------------------------------------------------------------
# Sampling: Long-term Consistency
# ------------------------------------------------------------------------
sampler_lengths: [12]
sample_intervals: [1,2, 3] 

# ------------------------------------------------------------------------
# Hardware & Memory Optimization (A10G Safe)
# ------------------------------------------------------------------------
BATCH_SIZE: 1
ACCUMULATE_STEPS: 16        # stabilize gradients
NUM_WORKERS: 1              # Reduced to save RAM/CPU-to-GPU overhead
USE_DECODER_CHECKPOINT: True # Mandatory for 8-frame windows
MEMORY_EFFICIENT: True      # Uses custom lightweight memory ops
TRAIN_DTYPE: "BF16"         # Cuts VRAM usage by ~40% vs FP32

# ------------------------------------------------------------------------
# Resolution Strategy: 800px Features
# ------------------------------------------------------------------------
# AUG_MAX_SIZE: 800
# AUG_RANDOM_RESIZE: [480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800]
AUG_MAX_SIZE: 1024  
AUG_RANDOM_RESIZE: [640, 704, 768, 832, 896, 960, 1024]
AUG_RANDOM_CROP_MIN: 512    # Safety floor for A10G VRAM
AUG_RANDOM_CROP_MAX: 800    # Prevent the crop from taking the whole 1024px image

# ------------------------------------------------------------------------
# Validation Config (Monitor IDF1 Growth)
# ------------------------------------------------------------------------
val_config:
  GT_FOLDER: "./datasets/DanceTrack/val"
  SEQMAP_FILE: "./datasets/DanceTrack/val_seqmap.txt"
  SPLIT_TO_EVAL: "val"
  CLASSES_TO_EVAL: ['pedestrian', 'car'] 
  LIMIT_VAL_FRAMES: 100
  LIMIT_VAL_SEQ: 5      
  CLASS_NAME_TO_ID: 
    pedestrian: 1
    car: 2

# ------------------------------------------------------------------------
# Inference Settings: "Focus" Mode
# ------------------------------------------------------------------------
INFERENCE_MAX_LONGER: 1333
INFERENCE_DTYPE: "BF16"
ASSIGNMENT_PROTOCOL: hungarian
# Higher thresholds now that the model is trained
MISS_TOLERANCE: 60 # Allow 2 seconds of occlusion (at 30fps)
DET_THRESH: 0.3             
NEWBORN_THRESH: 0.3         
ID_THRESH: 0.2