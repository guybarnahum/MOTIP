# configs/multi_class/stage2_refine.yaml

# ------------------------------------------------------------------------
# STAGE 2: TEMPORAL REFINEMENT
# Goal: Reduce ID Switches by increasing temporal cohesion
# Logic: Keep 608px for VRAM safety, but double the frame window.
# ------------------------------------------------------------------------

SUPER_CONFIG_PATH: ./configs/r50_deformable_detr_motip_dancetrack.yaml
root_path: "."
SEED: 12
NUM_CLASSES: 2
NUM_ID_VOCABULARY: 1000

# Weights Initialization
# Point to your solid Stage 1 foundation
DETR_PRETRAIN: ./pretrains/motip_stage1_stabilize.pth
RESUME_OPTIMIZER: False
RESUME_SCHEDULER: False

# ------------------------------------------------------------------------
# Training Strategy: 8-Epoch Refinement
# ------------------------------------------------------------------------
EPOCHS: 8           
LR: 1.0e-5          # Half of Stage 1 to avoid "forgetting" 99% precision
LR_DROP: 6          
LR_BACKBONE: 1.0e-6
LR_WARMUP_EPOCHS: 1 

# Refined Sampling: Increase to 8 frames to solve the ID Switch problem
sampler_lengths: [8]
sample_intervals: [2, 3, 4] # Slightly wider intervals to see more motion

# ------------------------------------------------------------------------
# Hardware Safety (A10G Optimized)
# ------------------------------------------------------------------------
BATCH_SIZE: 1
ACCUMULATE_STEPS: 4       
NUM_WORKERS: 2        
USE_DECODER_CHECKPOINT: True
PREFETCH_FACTOR: 2     
MEMORY_EFFICIENT: True

# Resolve VRAM Pressure from increased sampler_length
# We stick to 608 which proved stable in Stage 1 [cite: 52]
AUG_MAX_SIZE: 608
AUG_RANDOM_RESIZE: [256, 320, 384, 448, 480, 512, 544, 576, 608]

# ------------------------------------------------------------------------
# Validation Config (Monitor IDF1 Growth)
# ------------------------------------------------------------------------
val_config:
  GT_FOLDER: "./datasets/DanceTrack/val"
  SEQMAP_FILE: "./datasets/DanceTrack/val_seqmap.txt"
  SPLIT_TO_EVAL: "val"
  CLASSES_TO_EVAL: ['pedestrian', 'car'] 
  LIMIT_VAL_FRAMES: 100
  LIMIT_VAL_SEQ: 5      
  CLASS_NAME_TO_ID: 
    pedestrian: 1
    car: 2

# Inference Settings: "Focus" Mode
# Higher thresholds now that the model is trained
INFERENCE_MAX_LONGER: 1333
ASSIGNMENT_PROTOCOL: hungarian
DET_THRESH: 0.3             # Raised from 0.1 to clean up visual noise
NEWBORN_THRESH: 0.3         
ID_THRESH: 0.2