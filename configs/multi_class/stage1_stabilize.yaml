# configs/multi_class/stage1_stabilize.yaml

# ------------------------------------------------------------------------
# STAGE 1: UNIVERSAL FOUNDATION (Cars + People)
# Goal: Learn "Vehicle" class without forgetting "Person"
# Data: BDD (50%) + DanceTrack (50%) - Eye-level/Dashboard only
# ------------------------------------------------------------------------

# Base Architecture (Inherit from DanceTrack)
SUPER_CONFIG_PATH: ./configs/r50_deformable_detr_motip_dancetrack.yaml
root_path: "."

# Seed for Reproducibility across Stages
SEED: 12

# Dataset & Classes
# ⚠️ CRITICAL: Set to 2 to support both People (1) and Vehicles (2)
NUM_CLASSES: 2

# ID Dictionary Partitioning
# We use 1000 to allow 0-499 for Person and 500-999 for Vehicle
NUM_ID_VOCABULARY: 1000

# Weights Initialization
# Start from the strong Person tracker (DanceTrack weights)
# We do NOT resume optimizer/scheduler because we are modifying the architecture (Classes 1 -> 2)
DETR_PRETRAIN: ./pretrains/motip_dancetrack.pth
RESUME_OPTIMIZER: False
RESUME_SCHEDULER: False

# ------------------------------------------------------------------------
# Training Strategy: 6-Epoch Stabilization
# ------------------------------------------------------------------------
EPOCHS: 6           
LR: 2.0e-5          
LR_DROP: 5          
LR_BACKBONE: 2.0e-6
LR_WARMUP_EPOCHS: 1 
LR_DICTIONARY_SCALE: 1.0

# Sampling Strategy (Foundation Phase)
# Shorten the temporal window to 4 frames to handle high object counts
sampler_lengths: [4]
sample_intervals: [2, 3]

# ------------------------------------------------------------------------
# Hardware Safety (A10G / 24GB VRAM / 30GB RAM)
# ------------------------------------------------------------------------
BATCH_SIZE: 1
ACCUMULATE_STEPS: 4       
NUM_WORKERS: 2        # Safe for g5.2xlarge
USE_DECODER_CHECKPOINT: True
PREFETCH_FACTOR: 2     # Lowered from 6 to reduce baseline pressure

MEMORY_EFFICIENT: True

# Drop to 608 to create a massive buffer for 400+ object frames
AUG_MAX_SIZE: 608
AUG_RANDOM_RESIZE: [256, 320, 384, 448, 480, 512, 544, 576, 608]
AUG_RESIZE_SCALES: [256, 320, 384, 448, 480, 512, 544, 576, 608]

# Optimization for Deformable DETR Sampling
# Quality Priority: Kept at 4 to maintain detection accuracy.
DETR_DEC_N_POINTS: 4
DETR_ENC_N_POINTS: 4

# Output Directories (Handled automatically by train-start.sh)
# ------------------------------------------------------------------------
# Validation Config: Targeted Monitoring
# ------------------------------------------------------------------------
# Points to the symlinked 'universal' dataset
val_config:
  GT_FOLDER: "./datasets/DanceTrack/val"
  SEQMAP_FILE: "./datasets/DanceTrack/val_seqmap.txt"
  SPLIT_TO_EVAL: "val"
  
  # Evaluate BOTH classes to monitor dual-head performance
  CLASSES_TO_EVAL: ['pedestrian', 'car'] 
  LIMIT_VAL_FRAMES: 100
  LIMIT_VAL_SEQ: 5      # Speed Hack: Process 5 sequences instead of 20
  CLASS_NAME_TO_ID: 
    pedestrian: 1
    car: 2

# ------------------------------------------------------------------------
# Inference Settings: "Wake Up" Mode
# ------------------------------------------------------------------------
INFERENCE_MAX_LONGER: 1333  # Safety Cap for VRAM
ASSIGNMENT_PROTOCOL: hungarian
DET_THRESH: 0.1             # Lowered to see early detections
NEWBORN_THRESH: 0.1         # Lowered to allow tracks to start
ID_THRESH: 0.1              # Consistency with wake-up mode

USE_PARALLEL: False
NUM_PARALLEL_CORES: 1