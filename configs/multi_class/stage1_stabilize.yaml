# configs/multi_class/stage1_stabilize.yaml

# ------------------------------------------------------------------------
# STAGE 1: UNIVERSAL FOUNDATION (Cars + People)
# Goal: Learn "Vehicle" class without forgetting "Person"
# Data: BDD (50%) + DanceTrack (50%) - Eye-level/Dashboard only
# ------------------------------------------------------------------------

# Base Architecture (Inherit from DanceTrack)
SUPER_CONFIG_PATH: ./configs/r50_deformable_detr_motip_dancetrack.yaml
root_path: "."

# Seed for Reproducibility across Stages
SEED: 12

# Dataset & Classes
# ⚠️ CRITICAL: Set to 2 to support both People (1) and Vehicles (2)
NUM_CLASSES: 2

# ID Dictionary Partitioning
# We use 1000 to allow 0-499 for Person and 500-999 for Vehicle
NUM_ID_VOCABULARY: 1000

# Weights Initialization
# Start from the strong Person tracker (DanceTrack weights)
# We do NOT resume optimizer/scheduler because we are modifying the architecture (Classes 1 -> 2)
DETR_PRETRAIN: ./pretrains/motip_dancetrack.pth
RESUME_OPTIMIZER: False
RESUME_SCHEDULER: False

# ------------------------------------------------------------------------
# Training Strategy
# ------------------------------------------------------------------------
EPOCHS: 10
LR: 2.0e-5          # Standard transfer learning rate
LR_DROP: 7          # Drop at 7 gives 3 full epochs of fine-grained optimization
LR_BACKBONE: 2.0e-6
LR_WARMUP_EPOCHS: 3

# Learning Rate Scaling for Dictionary
# We want the new ID embeddings (especially for Vehicles) to learn faster
LR_DICTIONARY_SCALE: 1.0

# Sampling Strategy (Foundation Phase)
# We use 5 frames to establish short-term motion and category consistency.
sampler_lengths: [5]
sample_intervals: [2, 3]

# ------------------------------------------------------------------------
# Hardware Safety (A10G / 24GB VRAM)
# ------------------------------------------------------------------------
BATCH_SIZE: 1
ACCUMULATE_STEPS: 4       # Effective Batch Size = 4 (1 * 4)

# Quality Priority: Reduced workers to 2 to prevent instance hang on g5.2xlarge
NUM_WORKERS: 2

# Global flags for memory safety on A10G
MEMORY_EFFICIENT: True
USE_DECODER_CHECKPOINT: True

# Image Resolution Limits (Memory Safety for Stage 1)
# Quality Priority: Maintaining POINTS at 4, but limiting MAX_SIZE to 720
# to prevent the 22,000MB+ spikes that caused the previous crash.
AUG_MAX_SIZE: 720
AUG_RANDOM_RESIZE: [256, 384, 448]
AUG_RESIZE_SCALES: [400, 480, 512, 544, 576, 608]

# Optimization for Deformable DETR Sampling
# Quality Priority: Kept at 4 to maintain detection accuracy.
# VRAM is instead saved through smaller AUG_MAX_SIZE.
DETR_DEC_N_POINTS: 4
DETR_ENC_N_POINTS: 4

# Output Directories (Handled automatically by train-start.sh)
OUTPUT_DIR: null
OUTPUTS_DIR: null

# ------------------------------------------------------------------------
# Validation Config (Monitor Regression & Learning)
# ------------------------------------------------------------------------
# Points to the symlinked 'universal' dataset
val_config:
  GT_FOLDER: "./datasets/DanceTrack/val"
  SEQMAP_FILE: "./datasets/DanceTrack/val_seqmap.txt"
  SPLIT_TO_EVAL: "val"
  
  # Evaluate BOTH classes to monitor dual-head performance
  CLASSES_TO_EVAL: ['pedestrian', 'car'] 
  CLASS_NAME_TO_ID: 
    pedestrian: 1
    car: 2

# Inference Settings for Eval
# We use object-max for stabilization phase as it is more permissive for new classes
ASSIGNMENT_PROTOCOL: object-max
DET_THRESH: 0.3
ID_THRESH: 0.2